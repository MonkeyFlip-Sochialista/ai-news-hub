<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Hub | Agregador Autónomo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>AI<span>News</span>Hub</h1>
        <p>Lanzamientos y noticias de IA en tiempo real</p>
        <div class="search-bar">
            <input type="text" id="searchInput"
                placeholder="Buscar inteligencia artificial (ej: GPT-4, Sora, AlphaFold)..." autocomplete="off">
        </div>
    </header>

    <main id="app">
        <section>
            <div id="news-container" class="grid-container">
                <p class="loading">Cargando inteligencia...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Actualizado automáticamente cada 6 horas via GitHub Actions</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
